<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game</title>
    <style>
        .wall-left {
            
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 100%;
            background-color: #333;
        }

        .wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background-color: #333;
        }

        .platform {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background-color: #555;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #8B4513;
        }
    </style>
</head>
<body>
    <div class="wall-left"></div>
    <div class="wall-right"></div>
    <div class="platform"></div>
    <div class="ground"></div>
</body>
</html>
