<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        .wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 100%;
            background: #333;
        }

        .wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: #333;
        }

        .platform {
            position: absolute;
            width: 200px;
            height: 20px;
            background: #555;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: #555;
        }
    </style>
</head>

<body>

    <div class="wall-left"></div>
    <div class="wall-right"></div>
    <div class="ground"></div>

    <script>
        function createPlatforms(platforms) {
            platforms.forEach(platformData => {
                const platform = document.createElement("div");

                platform.classList.add("platform");

                if (platformData.top !== undefined)
                    platform.style.top = platformData.top;

                if (platformData.bottom !== undefined)
                    platform.style.bottom = platformData.bottom;

                if (platformData.left !== undefined)
                    platform.style.left = platformData.left;

                if (platformData.right !== undefined)
                    platform.style.right = platformData.right;

                document.body.appendChild(platform);
            });
        }
        createPlatforms([
            {
                top: "100px",
                left: "100px"
            },
            {
                bottom: "200px",
                right: "100px"
            },
            {
                bottom: "200px",
                left: "50%"
            },
            {
                left:"15%",
                bottom: "200px"
            }
        ]);
    </script>

</body>
</html>
